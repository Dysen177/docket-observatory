<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>案卷观察台启动失败</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; color: #f4f6f8; background: #0c0d0e; }
      main { width: 100%; display: grid; justify-items: center; gap: 16px; padding: 30px; border: 1px solid #3a2929; text-align: center; }
      img { width: 54px; height: 54px; border-radius: 8px; }
      div { display: grid; gap: 7px; }
      strong { font-size: 17px; font-weight: 680; }
      p { max-width: 350px; margin: 0; color: #c9a9a9; font-size: 12px; line-height: 1.55; }
      span { color: #9aa3ad; font-size: 11px; line-height: 1.5; }
      button { min-width: 112px; height: 34px; border: 1px solid #4a4f55; border-radius: 6px; color: #f4f6f8; background: #1b1e21; font: inherit; cursor: pointer; }
      button:hover { border-color: #70b7c8; background: #24292d; }
    </style>
  </head>
  <body>
    <main>
      <img src="../build/icon.png" alt="" />
      <div>
        <strong>启动安全检查或资料库校验失败</strong>
        <p>程序已停止启动，不会加载未知本地服务或降级为空资料库。请关闭占用端口的程序，或重新下载安装包并核对 SHA256SUMS.txt。</p>
        <span>Startup security or library verification failed. The app stopped instead of loading an unknown local service or an empty baseline.</span>
      </div>
      <button type="button">退出 / Quit</button>
    </main>
    <script src="startup-error.js"></script>
  </body>
</html>
