<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>案卷观察台</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; color: #f4f6f8; background: #0c0d0e; }
      main { width: 100%; display: grid; justify-items: center; gap: 18px; padding: 34px; border: 1px solid #24282d; }
      img { width: 58px; height: 58px; border-radius: 8px; }
      div { display: grid; justify-items: center; gap: 6px; text-align: center; }
      strong { font-size: 18px; font-weight: 680; }
      span { color: #9aa3ad; font-size: 12px; }
      i { width: 180px; height: 3px; overflow: hidden; background: #24282d; }
      i::after { content: ""; display: block; width: 42%; height: 100%; background: #70b7c8; animation: loading 1.2s ease-in-out infinite alternate; }
      @keyframes loading { from { transform: translateX(-20%); } to { transform: translateX(160%); } }
      @media (prefers-reduced-motion: reduce) { i::after { animation: none; width: 100%; } }
    </style>
  </head>
  <body>
    <main>
      <img src="../build/icon.png" alt="" />
      <div>
        <strong>正在准备完整本地资料库</strong>
        <span>Preparing the complete local research library</span>
      </div>
      <i aria-hidden="true"></i>
    </main>
  </body>
</html>
