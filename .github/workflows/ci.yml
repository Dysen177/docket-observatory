name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Verify community release configuration
        run: npm run release:preflight:community

      - name: Build renderer
        run: npm run build

      - name: Verify fresh no-key defaults
        run: npm run test:zero-key

      - name: Verify local settings persistence
        run: npm run test:settings

      - name: Verify cloud and local AI adapters
        run: npm run test:ai-adapters

      - name: Verify release-seed installation logic
        run: npm run release:test-seed-install

      - name: Verify incremental background processing selection
        run: npm run test:automation-selection

      - name: Verify public records, transcripts, translations, and AI retrieval
        run: |
          npm run test:public-records
          npm run test:public-record-transcripts
          npm run test:research-chat

      - name: Verify search fixture
        run: npm run test:search:fixture

      - name: Run security checks
        run: npm run security:check
