name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build renderer
        run: npm run build

      - name: Verify fresh no-key defaults
        run: npm run test:zero-key

      - name: Verify local settings persistence
        run: npm run test:settings

      - name: Verify release-seed installation logic
        run: npm run release:test-seed-install

      - name: Verify search fixture
        run: npm run test:search:fixture

      - name: Run security checks
        run: npm run security:check
