name: Release installer attestation

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  verify-and-attest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download published release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir release-assets
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir release-assets

      - name: Require exactly three desktop installers
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          mapfile -d '' arm64 < <(find release-assets -maxdepth 1 -type f -name "Docket-Observatory-${VERSION}-macOS-arm64*.dmg" -print0)
          mapfile -d '' x64 < <(find release-assets -maxdepth 1 -type f -name "Docket-Observatory-${VERSION}-macOS-x64*.dmg" -print0)
          mapfile -d '' windows < <(find release-assets -maxdepth 1 -type f -name "Docket-Observatory-${VERSION}-Windows-x64*.exe" -print0)
          test "${#arm64[@]}" = "1"
          test "${#x64[@]}" = "1"
          test "${#windows[@]}" = "1"
          test "$(find release-assets -maxdepth 1 -type f | wc -l | tr -d ' ')" = "3"

      - name: Attest published installers
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            release-assets/*.dmg
            release-assets/*.exe
