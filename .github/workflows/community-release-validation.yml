name: Community release native validation

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Draft or published community release tag, for example v0.1.0
        required: true
        type: string

permissions:
  # Draft releases are visible only to tokens with push-level repository access.
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Download Windows installer
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-assets | Out-Null
          $releases = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json
          $release = $releases | Where-Object { $_.tag_name -eq $env:RELEASE_TAG } | Select-Object -First 1
          if (-not $release) { throw "Release $env:RELEASE_TAG was not found, including drafts." }

          $asset = $release.assets | Where-Object { $_.name -like '*Windows-x64-unsigned.exe' } | Select-Object -First 1
          if (-not $asset) { throw "The Windows installer is missing from $env:RELEASE_TAG." }
          $destination = Join-Path 'release-assets' $asset.name
          gh api "repos/$env:GITHUB_REPOSITORY/releases/assets/$($asset.id)" -H 'Accept: application/octet-stream' > $destination
          if ($LASTEXITCODE -ne 0) { throw "Failed to download $($asset.name)." }

      - name: Test NSIS archive
        shell: pwsh
        run: |
          $installer = Get-ChildItem release-assets\*Windows-x64-unsigned.exe | Select-Object -First 1
          & 7z t $installer.FullName
          if ($LASTEXITCODE -ne 0) { throw "7-Zip installer test failed with exit code $LASTEXITCODE" }

      - name: Install complete edition silently
        shell: pwsh
        run: |
          $installer = Get-ChildItem release-assets\*Windows-x64-unsigned.exe | Select-Object -First 1
          $installDir = 'C:\docket-observatory-release-test'
          $process = Start-Process -FilePath $installer.FullName -ArgumentList '/S', "/D=$installDir" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "NSIS install failed with exit code $($process.ExitCode)" }
          "INSTALL_DIR=$installDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify installed x64 application and complete corpus
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: pwsh
        run: |
          $app = Join-Path $env:INSTALL_DIR '案卷观察台.exe'
          $resources = Join-Path $env:INSTALL_DIR 'resources'
          if (-not (Test-Path $app)) { throw 'Installed application executable is missing.' }
          $stream = [System.IO.File]::OpenRead($app)
          try {
            $reader = [System.IO.BinaryReader]::new($stream)
            $stream.Position = 0x3c
            $peOffset = $reader.ReadInt32()
            $stream.Position = $peOffset + 4
            $machine = $reader.ReadUInt16()
          } finally {
            $reader.Dispose()
            $stream.Dispose()
          }
          if ($machine -ne 0x8664) { throw "Installed application is not x86-64; PE machine is 0x$($machine.ToString('x4'))" }
          $pdfCount = (Get-ChildItem (Join-Path $resources 'court-files') -Recurse -Filter '*.pdf').Count
          $corpus = Get-Content (Join-Path $resources 'court-files\manifest.json') -Raw | ConvertFrom-Json
          $seed = Get-Content (Join-Path $resources 'seed-cache-manifest.json') -Raw | ConvertFrom-Json
          $expectedVersion = $env:RELEASE_TAG.TrimStart('v')
          if ($seed.appVersion -ne $expectedVersion) { throw "Installed seed version $($seed.appVersion) does not match release $expectedVersion." }
          if ($pdfCount -ne $seed.corpusValidPdfs) { throw "Installed corpus contains $pdfCount PDFs instead of the manifest-declared $($seed.corpusValidPdfs)." }
          if ($corpus.files.Count -ne $seed.corpusFiles) { throw "Installed corpus manifest contains $($corpus.files.Count) records instead of the seed-declared $($seed.corpusFiles)." }
          if ($seed.files.Count -ne $seed.seedFiles) { throw "Installed seed manifest lists $($seed.files.Count) files instead of its declared $($seed.seedFiles)." }
          $canvasBinding = Join-Path $resources 'app.asar.unpacked\node_modules\@napi-rs\canvas-win32-x64-msvc\skia.win32-x64-msvc.node'
          if (-not (Test-Path $canvasBinding)) { throw 'Windows PDF canvas native binding is missing.' }
          $versionInfo = (Get-Item $app).VersionInfo
          if ([string]::IsNullOrWhiteSpace($versionInfo.ProductName)) { throw 'Windows executable is missing product metadata and icon resource editing did not run.' }
          Write-Host "Validated Windows x64 install with $pdfCount PDFs and $($seed.seedFiles) seed files."

      - name: Verify renderer startup and running-app upgrade
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: pwsh
        run: |
          $app = Join-Path $env:INSTALL_DIR '案卷观察台.exe'
          $installer = Get-ChildItem release-assets\*Windows-x64-unsigned.exe | Select-Object -First 1
          $profile = Join-Path $env:RUNNER_TEMP 'docket-observatory-render-test'
          $ready = Join-Path $profile 'startup-ready.json'

          function Wait-ForRenderer($process, $marker, $expectedVersion) {
            $deadline = (Get-Date).AddMinutes(4)
            $lastMarker = ''
            while ((Get-Date) -lt $deadline) {
              if (Test-Path $marker) {
                try {
                  $lastMarker = Get-Content $marker -Raw
                  if (-not [string]::IsNullOrWhiteSpace($lastMarker)) {
                    $parsed = $lastMarker | ConvertFrom-Json
                    if (
                      $parsed.readyAt -and
                      $parsed.version -eq $expectedVersion -and
                      $parsed.platform -eq 'win32' -and
                      $parsed.arch -eq 'x64' -and
                      $parsed.transcriptCorpus.searchableTranscripts -eq 5097 -and
                      $parsed.transcriptCorpus.englishRecords -eq 5097 -and
                      $parsed.transcriptCorpus.englishMissingRecords -eq 0 -and
                      $parsed.transcriptCorpus.englishComplete -eq $true
                    ) {
                      return $parsed
                    }
                  }
                } catch {
                  # Node creates the marker before its single small write is
                  # guaranteed to be visible to another process. Retry until
                  # a complete JSON object is readable.
                }
              }
              if ($process.HasExited) {
                throw "Application exited before renderer startup with code $($process.ExitCode). Last marker: $lastMarker"
              }
              Start-Sleep -Seconds 2
            }
            throw "Renderer did not create a complete startup marker within four minutes. Last marker: $lastMarker"
          }

          $expectedVersion = $env:RELEASE_TAG.TrimStart('v')
          $first = Start-Process -FilePath $app -ArgumentList "--user-data-dir=$profile" -PassThru
          $firstReady = Wait-ForRenderer $first $ready $expectedVersion
          Write-Host "First startup marker: $($firstReady | ConvertTo-Json -Compress)"

          $upgrade = Start-Process -FilePath $installer.FullName -ArgumentList '/S', "/D=$env:INSTALL_DIR" -Wait -PassThru
          if ($upgrade.ExitCode -ne 0) { throw "Running-app upgrade failed with exit code $($upgrade.ExitCode)." }
          Start-Sleep -Seconds 2
          if (-not $first.HasExited) { throw 'Installer completed without closing the running application.' }

          Remove-Item $ready -Force
          $second = Start-Process -FilePath $app -ArgumentList "--user-data-dir=$profile" -PassThru
          $secondReady = Wait-ForRenderer $second $ready $expectedVersion
          Write-Host "Second startup marker: $($secondReady | ConvertTo-Json -Compress)"
          Stop-Process -Id $second.Id -Force
          Write-Host 'Validated first launch, rendered UI readiness, running-app upgrade, and post-upgrade launch.'

      - name: Show renderer diagnostics on failure
        if: failure()
        shell: pwsh
        run: |
          $profile = Join-Path $env:RUNNER_TEMP 'docket-observatory-render-test'
          foreach ($name in @('startup-ready.json', 'startup.log')) {
            $target = Join-Path $profile $name
            if (Test-Path $target) {
              Write-Host "===== $name ====="
              Get-Content $target -Raw
            }
          }

      - name: Uninstall test application
        if: always()
        shell: pwsh
        run: |
          if (-not $env:INSTALL_DIR) { exit 0 }
          $uninstaller = Join-Path $env:INSTALL_DIR 'Uninstall 案卷观察台.exe'
          if (Test-Path $uninstaller) {
            $process = Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "NSIS uninstall failed with exit code $($process.ExitCode)" }
          }
